name: Poker app validation

on:
  push:
    branches:
      - main
      - feat/pokerrrr2-table-settings
      - feat/full-pokerrrr-inspired-site-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type:check

      - name: Build server and client
        if: always()
        run: npm run build

      - name: Poker rules regression tests
        run: node scripts/test-poker-rules.cjs
